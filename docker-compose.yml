# Run the Tor proxy. Image is built with buildx bake (see docker-bake.hcl /
# bake.sh), not compose build:
#   bash bake.sh                # builds the tor image (default group)
#   bash bake.sh --push         # ...and pushes it to REGISTRY
#   docker compose up tor       # run it
#
# ONE image now runs both Tor and (optionally) Privoxy, supervised
# independently by s6-overlay — see Tor/Dockerfile and
# Tor/services/{tor,privoxy}/run. This replaces the previous separate
# "tor" + "tor-privoxy" images: Privoxy is now PRIVOXY_ENABLE, a runtime
# toggle on the same image, not a second container to run. If tor
# crashes, s6 restarts only tor inside the container; privoxy (if
# enabled) keeps running and just fails to reach the SOCKS port until
# tor's back up.
#
# SOCKS5, ControlPort, Hidden Service, exit/entry node selection, and
# bridges are all runtime toggles (the "tor" s6 service writes torrc from
# these env vars at container start). All use a TORRC_ prefix — see
# Tor/services/tor/run's header comment for the full reference.
#
# Privoxy vars use a PRIVOXY_ prefix — see Tor/services/privoxy/run's
# header comment for the full reference. PRIVOXY_TOR_SOCKS_HOST defaults
# to 127.0.0.1 since Privoxy now reaches Tor over loopback within the
# same container, not over a Compose network by service name.
#
# Multi-port hidden service: TORRC_HS_PORTS is a comma-separated list of
# "<virtport>:<target>" pairs, e.g. "80:10.2.0.2:80,443:10.2.0.2:443" —
# see the "tor-hs" example service below. TORRC_HS_PORT/TORRC_HS_TARGET
# (singular) still work as shorthand for a single port; TORRC_HS_PORTS
# takes priority when both are set.
#
# Secret-seeded key: mount an existing hs_ed25519_secret_key via
# `secrets:` at /run/secrets/tor_hs_ed25519_secret_key (or override
# TORRC_HS_SECRET_KEY_FILE) to reuse a known onion address instead of
# letting Tor generate a new one on first start.

services:
  # Plain SOCKS5 proxy — no hidden service, no Privoxy.
  tor:
    image: ghcr.io/arasemco/tor:latest
    hostname: tor
    restart: unless-stopped
    environment:
      TORRC_ENABLE_SOCKS: "true"
      TORRC_ENABLE_CONTROL: "false"
      TORRC_ENABLE_HS: "false"
      TORRC_SOCKS_PORT: "9050"
      TORRC_CONTROL_PORT: "9051"
      PRIVOXY_ENABLE: "false"
    ports:
      - "9050:9050"
      # Uncomment if TORRC_ENABLE_CONTROL=true:
      #- "9051:9051"
    volumes:
      - ./data/tor:/var/lib/tor

  # SOCKS5 proxy PLUS a Privoxy HTTP/HTTPS front-end in the same
  # container — for clients that can't speak SOCKS directly (some CLI
  # tools, older apps). Both processes are supervised independently by
  # s6-overlay: if one crashes, only that one restarts.
  #
  # Point HTTP/HTTPS clients at:
  #   http_proxy=http://localhost:8118 https_proxy=http://localhost:8118
  tor-privoxy:
    image: ghcr.io/arasemco/tor:latest
    hostname: tor-privoxy
    restart: unless-stopped
    environment:
      TORRC_ENABLE_SOCKS: "true"
      TORRC_SOCKS_PORT: "9050"
      PRIVOXY_ENABLE: "true"
      PRIVOXY_LISTEN_PORT: "8118"
      PRIVOXY_TOR_SOCKS_PORT: "9050"
      PRIVOXY_FORWARD_DNS: "true"
      PRIVOXY_ENABLE_FILTERS: "true"
#    ports:
#      - "9051:9050"
#      - "8118:8118"
    volumes:
      - ./data/tor-privoxy:/var/lib/tor

  # SOCKS5 proxy restricted to exit nodes in specific countries, refusing
  # to fall back elsewhere (StrictNodes). Also excludes a couple of
  # countries outright regardless of the ExitNodes allow-list, and avoids
  # routing through Russia at any hop (entry, middle, or exit).
  tor-exit-select:
    image: ghcr.io/arasemco/tor:latest
    hostname: tor-exit-select
    restart: unless-stopped
    environment:
      TORRC_ENABLE_SOCKS: "true"
      TORRC_SOCKS_PORT: "9050"
      TORRC_EXIT_NODES: "{us},{nl},{ch}"
      TORRC_EXCLUDE_EXIT_NODES: "{ru},{by}"
      TORRC_EXCLUDE_NODES: "{ru}"
      TORRC_STRICT_NODES: "true"
      PRIVOXY_ENABLE: "false"
    ports:
      - "9060:9050"
    volumes:
      - ./data/tor-exit-select:/var/lib/tor

  # SOCKS5 proxy over obfs4 bridges (censorship-circumvention scenario),
  # using the lyrebird pluggable-transport binary already built into the
  # image. Replace the placeholder bridge line with real bridge lines,
  # e.g. from https://bridges.torproject.org.
  tor-bridges:
    image: ghcr.io/arasemco/tor:latest
    hostname: tor-bridges
    restart: unless-stopped
    environment:
      TORRC_ENABLE_SOCKS: "true"
      TORRC_SOCKS_PORT: "9050"
      TORRC_ENABLE_BRIDGES: "true"
      TORRC_BRIDGE_TRANSPORT: "obfs4"
      # Multiple bridges: one per line (YAML block scalar) or separate
      # with the literal characters \n if your env source can't carry
      # real newlines.
      TORRC_BRIDGE_LINES: |
        obfs4 192.0.2.1:443 0000000000000000000000000000000000000A cert=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA iat-mode=0
      PRIVOXY_ENABLE: "false"
    ports:
      - "9070:9050"
    volumes:
      - ./data/tor-bridges:/var/lib/tor

  # Hidden service on multiple ports, reusing a pre-existing onion key
  # from a Docker secret. Onion routing needs no host `ports:` mapping —
  # traffic reaches the service over the Tor network, not a published
  # port — so nothing is exposed to the host here.
  tor-hs:
    image: ghcr.io/arasemco/tor:latest
    restart: unless-stopped
    environment:
      TORRC_ENABLE_HS: "true"
      TORRC_HS_PORTS: "80:10.2.0.2:80,443:10.2.0.2:443"
      PRIVOXY_ENABLE: "false"
    secrets:
      - tor_hs_ed25519_secret_key
    volumes:
      - tor_etc:/etc/tor
      - tor_var:/var/lib/tor
    networks:
      - frontend

volumes:
  tor_etc:
  tor_var:

networks:
  frontend:

secrets:
  tor_hs_ed25519_secret_key:
    file: /path/to/onion/keys/folder/hs_ed25519_secret_key
